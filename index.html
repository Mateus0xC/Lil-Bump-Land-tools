<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lil Bump Land Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav><a href="index.html" aria-current="page">Teleport</a><a href="commands.html">Commands</a></nav>
  <h1>Teleport Generator</h1>
  <p class="sub">Builds calls to <code>lbl:teleport/tp</code> and <code>lbl:teleport/tpr</code>.</p>

  <section>
    <h2>1. F3+C command</h2>
    <p class="hint">Stand at the destination in game, press <kbd>F3</kbd>+<kbd>C</kbd> and paste the copied command here.</p>
    <div class="row">
      <textarea id="src" rows="2" placeholder="execute in minecraft:overworld run tp @s 18.30 -57.85 3.08 434.36 11.21"></textarea>
      <button id="pasteBtn" type="button">Paste</button>
    </div>
    <div class="status" id="parseStatus">Tip: press <kbd>Ctrl</kbd>+<kbd>V</kbd> anywhere on the page to paste the command.</div>
  </section>

  <section>
    <h2>2. Arguments</h2>
    <div class="grid">
      <div class="full">
        <label for="dimension">dimension</label>
        <input id="dimension" type="text" list="dimensions" value="minecraft:overworld" autocomplete="off">
        <datalist id="dimensions">
          <option value="minecraft:overworld">
          <option value="minecraft:the_end">
          <option value="minecraft:the_nether">
        </datalist>
      </div>
      <div><label for="x">x</label><input id="x" type="text" inputmode="decimal"></div>
      <div><label for="y">y</label><input id="y" type="text" inputmode="decimal"></div>
      <div><label for="z">z</label><input id="z" type="text" inputmode="decimal"></div>
      <div class="rot"><label for="yaw">yaw</label><input id="yaw" type="text" inputmode="decimal" value="0"></div>
      <div class="rot"><label for="pitch">pitch</label><input id="pitch" type="text" inputmode="decimal" value="0"></div>
      <label class="check"><input id="ignoreRot" type="checkbox"> Ignore rotation</label>
      <div><label for="price">price</label><input id="price" type="text" inputmode="numeric" value="0"></div>
      <div class="wide">
        <label for="message">message</label>
        <input id="message" type="text" placeholder="I should be charging more for this service!">
      </div>
    </div>
  </section>

  <section>
    <h2>3. Result</h2>
    <pre id="out"></pre>
    <div class="out-actions">
      <button id="copyBtn" type="button">Copy</button>
      <span class="status" id="outStatus"></span>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const fields = ["dimension", "price", "x", "y", "z", "yaw", "pitch", "message"];
const NUM = "(-?\\d*\\.?\\d+)";
const TP_RE = new RegExp(`\\btp\\s+\\S+\\s+${NUM}\\s+${NUM}\\s+${NUM}(?:\\s+${NUM}\\s+${NUM})?`);
const DIM_RE = /\bin\s+([a-z0-9_.-]+:[a-z0-9_./-]+)/;

// Remembers price/message/rotation toggle between visits
const SAVED = ["price", "message"];
try {
  const s = JSON.parse(localStorage.getItem("lbl-tp") || "{}");
  SAVED.forEach(k => { if (s[k] != null) $(k).value = s[k]; });
  if (s.ignoreRot != null) $("ignoreRot").checked = s.ignoreRot;
} catch {}
function save() {
  try {
    const s = { ignoreRot: $("ignoreRot").checked };
    SAVED.forEach(k => s[k] = $(k).value);
    localStorage.setItem("lbl-tp", JSON.stringify(s));
  } catch {}
}

function parseCommand(text) {
  const m = TP_RE.exec(text || "");
  const st = $("parseStatus");
  if (!m) {
    st.textContent = text.trim() ? "Couldn't find a tp command with coordinates." : "";
    st.className = "status" + (text.trim() ? " error" : "");
    return false;
  }
  $("x").value = m[1]; $("y").value = m[2]; $("z").value = m[3];
  if (m[4] != null) { $("yaw").value = m[4]; $("pitch").value = m[5]; }
  const dim = DIM_RE.exec(text.slice(0, m.index));
  $("dimension").value = dim ? dim[1] : "minecraft:overworld";
  st.textContent = "Coordinates imported.";
  st.className = "status";
  generate();
  return true;
}

function num(v) {
  v = String(v).trim().replace(",", ".");
  if (!/^-?\d*\.?\d+$/.test(v)) return null;
  return String(Number(v));
}

// message is substituted into a JSON string inside tellraw, so escape for JSON first, then for SNBT
function escapeMessage(s) {
  const json = s.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
  return '"' + json.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
}

function generate() {
  const useRot = !$("ignoreRot").checked;
  document.querySelectorAll(".rot").forEach(el => el.classList.toggle("disabled", !useRot));
  $("yaw").disabled = $("pitch").disabled = !useRot;

  const keys = useRot ? ["price", "x", "y", "z", "pitch", "yaw"] : ["price", "x", "y", "z"];
  const parts = [], invalid = [];
  for (const k of keys) {
    const v = num($(k).value);
    if (v == null || (k === "price" && !Number.isInteger(+v))) invalid.push(k);
    else parts.push(`${k}:${v}`);
  }
  parts.push(`message:${escapeMessage($("message").value)}`);

  // While the field is focused and cleared (see below), the placeholder holds the current value
  let dim = $("dimension").value.trim() || $("dimension").placeholder || "minecraft:overworld";
  if (!dim.includes(":")) dim = "minecraft:" + dim;
  if (!/^[a-z0-9_.-]+:[a-z0-9_./-]+$/.test(dim)) invalid.push("dimension");
  // "as" before "in" so @p still picks the player in their current dimension
  const fn = useRot ? "lbl:teleport/tp" : "lbl:teleport/tpr";
  $("out").textContent = `execute as @p in ${dim} run function ${fn} {${parts.join(",")}}`;
  $("outStatus").textContent = invalid.length ? "Invalid value in: " + invalid.join(", ") : "";
  $("outStatus").className = "status" + (invalid.length ? " error" : "");
  $("copyBtn").disabled = invalid.length > 0;
  save();
}

fields.forEach(k => $(k).addEventListener("input", generate));
$("ignoreRot").addEventListener("change", generate);

// A datalist only suggests options matching the current text, so clear the field on focus to show
// all dimensions; the old value stays as placeholder and comes back if nothing is picked
const dimInput = $("dimension");
dimInput.addEventListener("focus", () => {
  dimInput.placeholder = dimInput.value;
  dimInput.value = "";
});
dimInput.addEventListener("blur", () => {
  if (!dimInput.value.trim()) dimInput.value = dimInput.placeholder;
  dimInput.placeholder = "";
  generate();
});
$("src").addEventListener("input", e => parseCommand(e.target.value));

$("pasteBtn").addEventListener("click", async () => {
  try {
    const text = await navigator.clipboard.readText();
    $("src").value = text;
    if (parseCommand(text)) $("message").focus();
  } catch {
    $("parseStatus").textContent = "No permission to read the clipboard. Paste into the field with Ctrl+V.";
    $("parseStatus").className = "status error";
  }
});

// Ctrl+V outside a text field imports the command
document.addEventListener("paste", e => {
  if (e.target.closest("input, textarea")) return;
  const text = e.clipboardData.getData("text");
  e.preventDefault();
  $("src").value = text;
  if (parseCommand(text)) $("message").focus();
});

$("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($("out").textContent);
    $("outStatus").textContent = "Copied!";
  } catch {
    $("outStatus").textContent = "Couldn't copy, select the text manually.";
  }
  $("outStatus").className = "status";
});

generate();
</script>
</body>
</html>
